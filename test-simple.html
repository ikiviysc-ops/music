<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最简单的地球测试</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: #050510;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .debug {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="debug" id="debug">Loading...</div>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script>
        const debugDiv = document.getElementById('debug');
        let scene, camera, renderer, earth;
        
        function log(msg) {
            debugDiv.innerHTML = msg + '<br>' + debugDiv.innerHTML;
            console.log(msg);
        }
        
        try {
            log('Three.js version: ' + THREE.REVISION);
            
            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            log('✅ Scene created');
            
            // 2. Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;
            log('✅ Camera created');
            
            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);
            log('✅ Renderer created');
            
            // 4. Earth
            const geometry = new THREE.SphereGeometry(1.6, 32, 32);
            const material = new THREE.MeshBasicMaterial({ color: 0x1a3a5c });
            earth = new THREE.Mesh(geometry, material);
            scene.add(earth);
            log('✅ Earth added to scene');
            
            // 5. Atmosphere
            const atmoGeo = new THREE.SphereGeometry(1.7, 32, 32);
            const atmoMat = new THREE.MeshBasicMaterial({ 
                color: 0x4488ff, 
                transparent: true, 
                opacity: 0.15,
                side: THREE.BackSide
            });
            const atmo = new THREE.Mesh(atmoGeo, atmoMat);
            scene.add(atmo);
            
            // Animation
            function animate() {
                requestAnimationFrame(animate);
                earth.rotation.y += 0.005;
                renderer.render(scene, camera);
            }
            animate();
            log('✅ Animation started');
            
            log('=== 全部就绪！你应该能看到一个蓝色地球 ===');
            
        } catch (e) {
            log('❌ ERROR: ' + e.message);
            console.error(e);
        }
    </script>
</body>
</html>
