<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a1a">
  <title>全球正在一起听</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary-purple: #7C3AED;
      --primary-blue: #00D1FF;
      --primary-pink: #FF6B9D;
      --accent-green: #00FFA3;
      --accent-orange: #FF9F43;
      --bg-dark: #0a0a1a;
      --bg-card: rgba(20, 20, 40, 0.7);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --text-muted: rgba(255, 255, 255, 0.4);
      --border-color: rgba(255, 255, 255, 0.1);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #0a0a1a 0%, #1a1a3a 50%, #0a0a1a 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .interactive {
      pointer-events: auto;
    }

    /* 背景装饰光效 */
    .bg-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.15) 0%, transparent 70%);
      top: -200px;
      left: -200px;
      z-index: 2;
      animation: glowPulse 8s ease-in-out infinite;
    }

    .bg-glow-right {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 209, 255, 0.1) 0%, transparent 70%);
      bottom: -150px;
      right: -150px;
      z-index: 2;
      animation: glowPulse 10s ease-in-out infinite reverse;
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }

    /* 顶部区域 */
    .header-section {
      padding: 20px 24px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      z-index: 30;
    }

    .title-block {
      flex: 1;
    }

    .main-title {
      font-size: 42px;
      line-height: 1.02;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -1.5px;
      position: relative;
    }

    .title-gradient {
      background: linear-gradient(135deg, var(--primary-purple) 0%, var(--primary-blue) 50%, var(--primary-pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .wave-icon {
      display: inline-block;
      margin-left: 10px;
      animation: waveAnimation 2s ease-in-out infinite;
    }

    @keyframes waveAnimation {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .subtitle {
      margin-top: 10px;
      font-size: 15px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: livePulse 1.5s ease-in-out infinite;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .header-right {
      display: flex;
      gap: 14px;
      padding-top: 8px;
    }

    .search-btn {
      width: 46px;
      height: 46px;
      border-radius: 23px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .search-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .search-btn:hover::before {
      left: 100%;
    }

    .search-btn:hover {
      border-color: rgba(124, 58, 237, 0.5);
      transform: scale(1.05);
    }

    .search-icon {
      width: 24px;
      height: 24px;
      color: var(--text-primary);
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 26px;
      border: 2px solid transparent;
      background: linear-gradient(var(--bg-dark), var(--bg-dark)) padding-box,
                  linear-gradient(135deg, var(--primary-purple), var(--primary-blue)) border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .avatar:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 30px rgba(124, 58, 237, 0.4);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 实时数据统计卡片 */
    .stats-section {
      padding: 0 24px;
      margin-top: 16px;
      z-index: 25;
    }

    .stats-grid {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .stats-grid::-webkit-scrollbar {
      display: none;
    }

    .stat-card {
      flex-shrink: 0;
      min-width: 100px;
      padding: 14px 18px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .stat-card:hover {
      border-color: rgba(124, 58, 237, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-trend {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      font-size: 11px;
      color: var(--accent-green);
    }

    /* 地球空间 */
    .earth-space {
      flex: 1;
      position: relative;
      z-index: 20;
    }

    /* 右侧控制按钮 */
    .side-controls {
      position: absolute;
      right: 16px;
      bottom: 200px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 25;
    }

    .control-btn {
      width: 50px;
      height: 50px;
      border-radius: 25px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .control-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.3), rgba(0, 209, 255, 0.3));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .control-btn:hover::before {
      opacity: 1;
    }

    .control-btn:hover {
      transform: scale(1.1);
      border-color: rgba(124, 58, 237, 0.6);
    }

    .control-btn.active {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.4), rgba(0, 209, 255, 0.2));
      border-color: var(--primary-purple);
    }

    .control-btn svg {
      width: 24px;
      height: 24px;
      color: var(--text-primary);
      position: relative;
      z-index: 1;
    }

    /* 地球模式选择菜单 */
    .mode-menu {
      position: fixed;
      right: 16px;
      bottom: 270px;
      background: rgba(15, 15, 30, 0.98);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 12px;
      z-index: 100;
      min-width: 200px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(15px);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .mode-menu.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    .mode-menu-title {
      font-size: 11px;
      color: var(--text-muted);
      padding: 8px 14px 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .mode-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
    }

    .mode-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .mode-item.active {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.3), rgba(0, 209, 255, 0.1));
      color: var(--text-primary);
    }

    .mode-check {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.25s ease;
    }

    .mode-item.active .mode-check {
      border-color: var(--primary-purple);
      background: var(--primary-purple);
    }

    .mode-item.active .mode-check::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
    }

    /* 热门歌曲推荐 */
    .hot-tracks {
      position: absolute;
      left: 16px;
      bottom: 200px;
      z-index: 25;
      width: 280px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .section-more {
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .section-more:hover {
      color: var(--primary-purple);
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-item {
      display: flex;
      gap: 12px;
      padding: 10px 12px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 14px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .track-item:hover {
      border-color: rgba(124, 58, 237, 0.3);
      transform: translateX(4px);
    }

    .track-cover {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .track-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .track-rank {
      position: absolute;
      top: -4px;
      left: -4px;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: var(--primary-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: white;
    }

    .track-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .track-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .track-players {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .track-players svg {
      width: 14px;
      height: 14px;
      color: var(--accent-green);
    }

    .track-players span {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* 底部播放器 */
    .bottom-player {
      position: fixed;
      bottom: 58px;
      left: 0;
      right: 0;
      padding: 0 16px;
      z-index: 35;
      pointer-events: auto;
    }

    .player-card {
      background: rgba(15, 15, 30, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .player-card:hover {
      border-color: rgba(124, 58, 237, 0.3);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .player-cover {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .player-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-cover::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.3), transparent);
    }

    .player-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .player-song-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-artist {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .player-progress {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-top: 6px;
      cursor: pointer;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-purple), var(--primary-blue));
      border-radius: 2px;
      transition: width 0.3s ease;
      width: 45%;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-btn {
      width: 36px;
      height: 36px;
      border-radius: 18px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .player-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: scale(1.1);
    }

    .player-btn svg {
      width: 20px;
      height: 20px;
      color: var(--text-primary);
    }

    .player-btn-play {
      width: 54px;
      height: 54px;
      border-radius: 27px;
      background: linear-gradient(135deg, var(--primary-purple), var(--primary-blue));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .player-btn-play:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 35px rgba(124, 58, 237, 0.5);
    }

    .player-btn-play svg {
      width: 24px;
      height: 24px;
    }

    /* 底部导航栏 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: rgba(10, 10, 20, 0.98);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: max(4px, env(safe-area-inset-bottom));
      z-index: 40;
      pointer-events: auto;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      padding: 6px 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
      color: var(--text-muted);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-item span {
      font-size: 10px;
      color: var(--text-muted);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-item.active svg,
    .nav-item.active span {
      color: var(--primary-purple);
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      top: 0;
      width: 20px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary-purple), var(--primary-blue));
      border-radius: 0 0 3px 3px;
    }

    .nav-item:hover svg {
      color: var(--text-secondary);
    }

    .nav-item:hover span {
      color: var(--text-secondary);
    }

    /* 响应式调整 */
    @media (max-width: 375px) {
      .main-title {
        font-size: 36px;
      }
      .header-section {
        padding: 16px 16px 0;
      }
      .stats-section {
        padding: 0 16px;
      }
      .hot-tracks {
        width: 260px;
      }
      .player-card {
        padding: 10px 12px;
      }
      .player-cover {
        width: 48px;
        height: 48px;
      }
    }

    @media (min-width: 414px) {
      .main-title {
        font-size: 48px;
      }
      .hot-tracks {
        width: 300px;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div class="bg-glow"></div>
  <div class="bg-glow-right"></div>
  
  <div class="ui-overlay">
    <div class="header-section interactive">
      <div class="title-block">
        <h1 class="main-title">
          <span class="title-gradient">全球正在</span><br>一起听
          <span class="wave-icon">
            <svg width="52px" height="28px" viewBox="0 0 56 30" fill="none">
              <path d="M4 22C4 22 8 16 10 14C14 10 20 10 22 14C24 18 26 22 26 22C26 22 28 16 30 14C34 10 40 10 44 14C48 18 48 22 48 22" stroke="url(#waveGradient)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 16C2 16 6 12 8 12C12 12 16 16 16 16C16 16 20 12 24 12C28 12 32 16 32 16C32 16 36 12 40 12C44 12 50 16 50 16" stroke="url(#waveGradient2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <defs>
                <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#7C3AED"/>
                  <stop offset="50%" stop-color="#00D1FF"/>
                  <stop offset="100%" stop-color="#FF6B9D"/>
                </linearGradient>
                <linearGradient id="waveGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6"/>
                  <stop offset="50%" stop-color="#00D1FF" stop-opacity="0.6"/>
                  <stop offset="100%" stop-color="#FF6B9D" stop-opacity="0.6"/>
                </linearGradient>
              </defs>
            </svg>
          </span>
        </h1>
        <p class="subtitle">
          <span class="live-dot"></span>
          此刻，世界各地都在听相同的旋律
        </p>
      </div>
      <div class="header-right">
        <button class="search-btn">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <div class="avatar">
          <img class="avatar-img" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=200&auto=format&fit=crop" alt="avatar">
        </div>
      </div>
    </div>
    
    <div class="stats-section interactive">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value">2.8M</div>
          <div class="stat-label">在线听众</div>
          <div class="stat-trend">
