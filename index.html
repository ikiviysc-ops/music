<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050510">
  <title>全球正在一起听</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050510;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #canvas-container canvas {
      display: block;
      touch-action: none;
    }

    .ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      padding: max(12px, env(safe-area-inset-top)) 0 max(12px, env(safe-area-inset-bottom)) 0;
    }

    .interactive {
      pointer-events: auto;
    }

    .header-section {
      padding: 8px 12px;
      margin-bottom: 4px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .title-block {
      flex: 1;
    }

    .main-title {
      font-size: 26px;
      line-height: 1.1;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .wave-icon {
      display: inline-block;
      margin-left: 4px;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .header-right {
      display: flex;
      gap: 12px;
      padding-top: 4px;
    }

    .search-btn {
      width: 32px;
      height: 32px;
      border-radius: 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-icon {
      width: 22px;
      height: 22px;
      color: #fff;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 18px;
      border: 2px solid #7C3AED;
      background: linear-gradient(135deg, #7C3AED, #00D1FF);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .earth-space {
      flex: 1;
      position: relative;
    }

    .side-controls {
      position: absolute;
      right: 12px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
    }

    .control-btn {
      width: 40px;
      height: 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    .control-btn svg {
      width: 24px;
      height: 24px;
      color: #fff;
    }

    .play-indicator {
      position: absolute;
      left: 10px;
      bottom: 100px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 6px 12px;
    }

    .play-btn {
      width: 32px;
      height: 32px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn svg {
      width: 18px;
      height: 18px;
      color: #fff;
    }

    .play-texts {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .play-text {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.8);
    }

    .play-time {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
    }

    .bottom-scroll {
      padding: 0 10px 110px 10px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      pointer-events: auto;
    }

    .bottom-scroll::-webkit-scrollbar {
      display: none;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title-text {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .card-subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .card-more {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .song-item:hover {
      transform: translateX(4px);
    }

    .song-rank {
      font-size: 16px;
      font-weight: 800;
      width: 20px;
      color: #7C3AED;
    }

    .song-cover {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #7C3AED, #00D1FF);
      flex-shrink: 0;
      overflow: hidden;
    }

    .song-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .song-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .song-name {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .song-artist {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
    }

    .song-stats {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .song-listeners {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
    }

    .song-bar {
      width: 70px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .song-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #7C3AED, #00D1FF);
      border-radius: 2px;
    }

    .trend-card {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.12), rgba(0, 209, 255, 0.06));
      border-color: rgba(124, 58, 237, 0.25);
    }

    .trend-header {
      margin-bottom: 12px;
    }

    .trend-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .trend-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
    }

    .trend-value {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }

    .trend-change {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: #00FFA3;
    }

    .trend-map {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.8;
    }

    .bottom-player {
      position: fixed;
      bottom: 50px;
      left: 0;
      right: 0;
      padding: 0 10px;
      z-index: 25;
      pointer-events: auto;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-cover {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: linear-gradient(135deg, #7C3AED, #FF6B9D);
      flex-shrink: 0;
      overflow: hidden;
    }

    .player-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .player-song-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }

    .player-artist {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-btn {
      width: 26px;
      height: 26px;
      border-radius: 13px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-btn svg {
      width: 16px;
      height: 16px;
      color: #fff;
    }

    .player-btn-play {
      width: 44px;
      height: 44px;
      border-radius: 22px;
      border: 2px solid rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.08);
    }

    .player-btn-play svg {
      width: 18px;
      height: 18px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: rgba(10, 10, 20, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 30;
      pointer-events: auto;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      padding: 6px 12px;
      transition: all 0.25s ease;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      color: rgba(255, 255, 255, 0.55);
      transition: all 0.25s ease;
    }

    .nav-item span {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.55);
      transition: all 0.25s ease;
    }

    .nav-item.active svg,
    .nav-item.active span {
      color: #7C3AED;
    }

    @media (min-width: 768px) {
      .main-title {
        font-size: 42px;
      }
      
      .bottom-scroll {
        padding-bottom: 160px;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div class="ui-overlay">
    <div class="header-section interactive">
      <div class="title-block">
        <h1 class="main-title">
          全球正在<br>一起听
          <span class="wave-icon">
            <svg width="40" height="24" viewBox="0 0 40 24" fill="none">
              <path d="M4 18C4 18 6 14 8 12C10 10 14 10 16 12C18 14 20 18 20 18C20 18 22 14 24 12C26 10 30 10 32 12C34 14 36 18 36 18" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 12C2 12 4 10 6 10C8 10 10 12 10 12C10 12 12 10 14 10C16 10 18 12 18 12C18 12 20 10 22 10C24 10 26 12 26 12C26 12 28 10 30 10C32 10 34 12 34 12C34 12 36 10 38 10" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
            </svg>
          </span>
        </h1>
        <p class="subtitle">此刻，世界各地都在听相同的旋律</p>
      </div>
      <div class="header-right">
        <button class="search-btn">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <div class="avatar">
          <img class="avatar-img" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=200&auto=format&fit=crop" alt="avatar">
        </div>
      </div>
    </div>
    
    <div class="earth-space">
      <div class="side-controls interactive">
        <button class="control-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10M12 2a15.3 15.3 0 0 0-4 10 15.3 15.3 0 0 0 4 10M2 12h20"/>
          </svg>
        </button>
        <button class="control-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <line x1="12" y1="2" x2="12" y2="22"/>
          </svg>
        </button>
      </div>
      
      <div class="play-indicator interactive">
        <button class="play-btn">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
        </button>
        <div class="play-texts">
          <span class="play-text">实时更新</span>
          <span class="play-time" id="update-time">12:34:56</span>
        </div>
      </div>
    </div>
    
    <div class="bottom-scroll">
      <div class="card interactive">
        <div class="card-header">
          <div class="card-title">
            <span class="card-title-text">全球正在听的歌曲</span>
            <svg width="32" height="20" viewBox="0 0 32 20" fill="none">
              <path d="M3 12C3 12 5 9 7 7C9 5 13 5 15 7C17 9 19 12 19 12C19 12 21 9 23 7C25 5 29 5 29 5" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="card-more">
            查看全部
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </div>
        </div>
        
        <div class="song-list">
          <div class="song-item">
            <span class="song-rank">1</span>
            <div class="song-cover">
              <img class="song-cover-img" src="https://images.unsplash.com/photo-1619983081563-430f63602796?q=80&w=200&auto=format&fit=crop" alt="Lose Control">
            </div>
            <div class="song-info">
              <div class="song-name">Lose Control</div>
              <div class="song-artist">Teddy Swims</div>
            </div>
            <div class="song-stats">
              <span class="song-listeners">1,246,873人在听</span>
              <div class="song-bar">
                <div class="song-bar-fill" style="width: 100%"></div>
              </div>
            </div>
          </div>
          
          <div class="song-item">
            <span class="song-rank">2</span>
            <div class="song-cover">
              <img class="song-cover-img" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=200&auto=format&fit=crop" alt="Birds of a Feather">
            </div>
            <div class="song-info">
              <div class="song-name">Birds of a Feather</div>
              <div class="song-artist">Billie Eilish</div>
            </div>
            <div class="song-stats">
              <span class="song-listeners">987,453人在听</span>
              <div class="song-bar">
                <div class="song-bar-fill" style="width: 78%"></div>
              </div>
            </div>
          </div>
          
          <div class="song-item">
            <span class="song-rank">3</span>
            <div class="song-cover">
              <img class="song-cover-img" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=200&auto=format&fit=crop" alt="Beautiful Things">
            </div>
            <div class="song-info">
              <div class="song-name">Beautiful Things</div>
              <div class="song-artist">Benson Boone</div>
            </div>
            <div class="song-stats">
              <span class="song-listeners">876,321人在听</span>
              <div class="song-bar">
                <div class="song-bar-fill" style="width: 68%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="card trend-card interactive">
        <div class="trend-header">
          <div class="trend-label">全球听歌热度</div>
          <div class="trend-main">
            <span class="trend-value">正在上升</span>
            <div class="trend-change">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                <polyline points="17 6 23 6 23 12"/>
              </svg>
              +12.6%
            </div>
          </div>
          <div class="trend-label">较过去1小时</div>
        </div>
        
        <div class="trend-map">
          <svg width="100%" height="80" viewBox="0 0 240 80">
            <g opacity="0.4">
              <circle cx="60" cy="35" r="2.5" fill="#7C3AED"/>
              <circle cx="110" cy="30" r="3" fill="#7C3AED"/>
              <circle cx="180" cy="38" r="2.8" fill="#7C3AED"/>
              <circle cx="195" cy="50" r="2" fill="#7C3AED"/>
              <circle cx="80" cy="60" r="2" fill="#7C3AED"/>
            </g>
            <g opacity="0.25">
              <circle cx="40" cy="40" r="1.5"/>
              <circle cx="90" cy="45" r="1.8"/>
              <circle cx="150" cy="40" r="1.6"/>
              <circle cx="200" cy="32" r="1.7"/>
              <circle cx="160" cy="55" r="1.5"/>
            </g>
            <g opacity="0.15">
              <circle cx="30" cy="48" r="1"/>
              <circle cx="65" cy="50" r="1"/>
              <circle cx="120" cy="48" r="1.2"/>
              <circle cx="210" cy="45" r="1"/>
            </g>
          </svg>
        </div>
      </div>
    </div>
  </div>
  
  <div class="bottom-player interactive">
    <div class="player-card">
      <div class="player-cover">
        <img class="song-cover-img" src="https://images.unsplash.com/photo-1506157786151-b8491531f063?q=80&w=200&auto=format&fit=crop" alt="Mystery of Love">
      </div>
      <div class="player-info">
        <div class="player-song-name">Mystery of Love</div>
        <div class="player-artist">Sufjan Stevens</div>
      </div>
      <div class="player-controls">
        <button class="player-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="19 20 9 12 19 4 19 20"/>
            <line x1="5" y1="19" x2="5" y2="5"/>
          </svg>
        </button>
        <button class="player-btn player-btn-play">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <rect x="6" y="4" width="4" height="16"/>
            <rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>
        <button class="player-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="5 4 15 12 5 20 5 4"/>
            <line x1="19" y1="5" x2="19" y2="19"/>
          </svg>
        </button>
        <button class="player-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="10" width="18" height="10" rx="2"/>
            <circle cx="8" cy="15" r="2"/>
            <path d="M12 3v7"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  
  <div class="bottom-nav interactive">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>首页</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <span>发现</span>
    </div>
    <div class="nav-item">
