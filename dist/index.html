<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050510">
  <title>全球正在一起听</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050510;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .interactive {
      pointer-events: auto;
    }

    /* 顶部区域 */
    .header-section {
      padding: 16px 20px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .title-block {
      flex: 1;
    }

    .main-title {
      font-size: 38px;
      line-height: 1.05;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
    }

    .wave-icon {
      display: inline-block;
      margin-left: 8px;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 15px;
      color: rgba(255, 255, 255, 0.6);
    }

    .header-right {
      display: flex;
      gap: 12px;
      padding-top: 6px;
    }

    .search-btn {
      width: 42px;
      height: 42px;
      border-radius: 21px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-icon {
      width: 28px;
      height: 28px;
      color: #fff;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 24px;
      border: 2px solid #7C3AED;
      background: linear-gradient(135deg, #7C3AED, #00D1FF);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 地球空间 - 占据中间主要区域 */
    .earth-space {
      flex: 1;
      position: relative;
    }

    /* 右侧控制按钮 */
    .side-controls {
      position: absolute;
      right: 14px;
      bottom: 160px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
    }

    .control-btn {
      width: 46px;
      height: 46px;
      border-radius: 23px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.08);
    }

    .control-btn svg {
      width: 24px;
      height: 24px;
      color: #fff;
    }

    /* 左下播放指示器 */
    .play-indicator {
      position: absolute;
      left: 14px;
      bottom: 160px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 6px 12px;
    }

    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 22px;
      border: 2px solid rgba(255, 255, 255, 0.5);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn svg {
      width: 20px;
      height: 20px;
      color: #fff;
    }

    .play-texts {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .play-text {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
    }

    .play-time {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.65);
    }

    /* 底部播放器 */
    .bottom-player {
      position: fixed;
      bottom: 66px;
      left: 0;
      right: 0;
      padding: 0 12px;
      z-index: 25;
      pointer-events: auto;
    }

    .player-card {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-cover {
      width: 46px;
      height: 46px;
      border-radius: 9px;
      background: linear-gradient(135deg, #7C3AED, #FF6B9D);
      flex-shrink: 0;
      overflow: hidden;
    }

    .player-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .player-song-name {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .player-artist {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-btn {
      width: 32px;
      height: 32px;
      border-radius: 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-btn svg {
      width: 20px;
      height: 20px;
      color: #fff;
    }

    .player-btn-play {
      width: 50px;
      height: 50px;
      border-radius: 25px;
      border: 2px solid rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.08);
    }

    .player-btn-play svg {
      width: 22px;
      height: 22px;
    }

    /* 底部导航栏 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(10, 10, 20, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: max(4px, env(safe-area-inset-bottom));
      z-index: 30;
      pointer-events: auto;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      padding: 6px 14px;
      transition: all 0.3s ease;
    }

    .nav-item svg {
      width: 26px;
      height: 26px;
      color: rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
    }

    .nav-item span {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
    }

    .nav-item.active svg,
    .nav-item.active span {
      color: #7C3AED;
    }

    /* 响应式调整 */
    @media (max-width: 375px) {
      .main-title {
        font-size: 34px;
      }
      .header-section {
        padding: 12px 14px 0;
      }
    }

    @media (min-width: 414px) {
      .main-title {
        font-size: 42px;
      }
    }
  </style>
