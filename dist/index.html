<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050510">
  <title>全球一起听</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary-purple: #7C3AED;
      --primary-blue: #00D1FF;
      --primary-pink: #FF6B9D;
      --accent-green: #00FFA3;
      --bg-dark: #050510;
      --bg-card: rgba(15, 15, 30, 0.6);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.55);
      --text-muted: rgba(255, 255, 255, 0.35);
      --border-color: rgba(255, 255, 255, 0.08);
      --color-1: #7C3AED;
      --color-2: #00D1FF;
      --color-3: #FF6B9D;
      --color-4: #00FFA3;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050510;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .interactive {
      pointer-events: auto;
    }

    .bg-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.1) 0%, transparent 70%);
      top: -150px;
      left: -150px;
      z-index: 2;
      animation: glowPulse 10s ease-in-out infinite;
    }

    .bg-glow-right {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 209, 255, 0.08) 0%, transparent 70%);
      bottom: -100px;
      right: -100px;
      z-index: 2;
      animation: glowPulse 12s ease-in-out infinite reverse;
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.7; }
    }

    .header-section {
      padding: 14px 16px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      z-index: 30;
    }

    .title-block {
      flex: 1;
    }

    .main-title {
      font-size: 28px;
      line-height: 1.1;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.8px;
    }

    .title-gradient {
      background: linear-gradient(135deg, var(--primary-purple) 0%, var(--primary-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .wave-icon {
      display: inline-block;
      margin-left: 6px;
      vertical-align: middle;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: livePulse 1.5s ease-in-out infinite;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .header-right {
      display: flex;
      gap: 10px;
      padding-top: 4px;
    }

    .search-btn {
      width: 36px;
      height: 36px;
      border-radius: 18px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    .search-btn:hover {
      border-color: rgba(124, 58, 237, 0.4);
      transform: scale(1.05);
    }

    .search-icon {
      width: 18px;
      height: 18px;
      color: var(--text-primary);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 20px;
      border: 1.5px solid transparent;
      background: linear-gradient(var(--bg-dark), var(--bg-dark)) padding-box,
                  linear-gradient(135deg, var(--primary-purple), var(--primary-blue)) border-box;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .avatar:hover {
      transform: scale(1.05);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .stats-section {
      padding: 0 16px;
      margin-top: 10px;
      z-index: 25;
    }

    .stats-grid {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .stats-grid::-webkit-scrollbar {
      display: none;
    }

    .stat-card {
      flex-shrink: 0;
      min-width: 75px;
      padding: 10px 12px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .stat-card:hover {
      border-color: rgba(124, 58, 237, 0.3);
      transform: translateY(-1px);
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .stat-trend {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-top: 4px;
      font-size: 9px;
      color: var(--accent-green);
    }

    .earth-space {
      flex: 1;
      position: relative;
      z-index: 20;
    }

    .side-controls {
      position: absolute;
      right: 12px;
      bottom: 160px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 25;
    }

    .control-btn {
      width: 40px;
      height: 40px;
      border-radius: 20px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    .control-btn:hover {
      border-color: rgba(124, 58, 237, 0.5);
      transform: scale(1.08);
    }

    .control-btn.active {
      background: rgba(124, 58, 237, 0.25);
      border-color: var(--primary-purple);
    }

    .control-btn svg {
      width: 18px;
      height: 18px;
      color: var(--text-primary);
    }

    .mode-menu {
      position: fixed;
      right: 12px;
      bottom: 210px;
      background: rgba(10, 10, 25, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 8px;
      z-index: 100;
      min-width: 160px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .mode-menu.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    .mode-menu-title {
      font-size: 10px;
      color: var(--text-muted);
      padding: 6px 10px 4px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }

    .mode-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
    }

    .mode-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .mode-item.active {
      background: rgba(124, 58, 237, 0.2);
      color: var(--text-primary);
    }

    .mode-check {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .mode-item.active .mode-check {
      border-color: var(--primary-purple);
      background: var(--primary-purple);
    }

    .mode-item.active .mode-check::after {
      content: '';
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: white;
    }

    .hot-tracks {
      position: absolute;
      left: 12px;
      bottom: 160px;
      z-index: 25;
      width: 220px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .section-more {
      font-size: 10px;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .section-more:hover {
      color: var(--primary-purple);
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track-item {
      display: flex;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .track-item:hover {
      border-color: rgba(124, 58, 237, 0.25);
      transform: translateX(3px);
    }

    .track-cover {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .track-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .track-rank {
      position: absolute;
      top: -3px;
      left: -3px;
      width: 16px;
      height: 16px;
      border-radius: 5px;
      background: var(--primary-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 700;
      color: white;
    }

    .track-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .track-name {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .track-players {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }

    .track-players svg {
      width: 11px;
      height: 11px;
      color: var(--accent-green);
    }

    .track-players span {
      font-size: 9px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .bottom-player {
      position: fixed;
      bottom: 52px;
      left: 0;
      right: 0;
      padding: 0 12px;
      z-index: 35;
      pointer-events: auto;
    }

    #fpPlayerCard {
      background: rgba(22, 22, 22, 0.12);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.12);
      transition: all 0.25s ease;
      padding-left: 0;
    }

    #fpPlayerCard:hover {
      border-color: rgba(124, 58, 237, 0.25);
    }

    #fpMusicBackground {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 150%;
      height: 150%;
      background: linear-gradient(135deg, rgba(37, 98, 234, 0.15) 0%, rgba(122, 168, 255, 0.1) 100%);
      background-size: cover;
      background-position: center;
      filter: blur(8px);
      opacity: 0.5;
      z-index: 0;
      transition: opacity 0.5s;
      will-change: opacity;
    }

    #fpLyricBigChar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      font-weight: 900;
      opacity: 0;
      filter: blur(1px);
      pointer-events: none;
      z-index: 1;
      color: rgba(255, 255, 255, 0.3);
      white-space: nowrap;
    }

    #fpProgressFill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(37, 98, 234, 0.25) 0%, rgba(122, 168, 255, 0.15) 80%, rgba(122, 168, 255, 0.25) 100%);
      z-index: 0;
      transition: width 0.3s ease;
      pointer-events: none;
    }

    #fpBreathBar {
      position: absolute;
      right: -1px;
      top: 0;
      height: 100%;
      width: 1px;
      background: rgba(255, 255, 255, 0.6);
      animation: breathBar 1.5s ease-in-out infinite;
    }

    @keyframes breathBar {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    #fpMusicPlayerCard {
      padding: 0 16px;
      display: flex;
      align-items: center;
      height: 44px;
      position: relative;
      z-index: 2;
    }

    #fpMusicCover {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }

    #fpCoverImage {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      transition: transform 0.3s ease;
    }

    #fpMusicCover.playing #fpCoverImage {
      animation: coverRotate 8s linear infinite;
    }

    @keyframes coverRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    #fpCoverPlaceholder {
      width: 100%;
      height: 100%;
      object-fit: cover;
      padding: 10px;
    }

    #fpMusicTitle {
      font-size: 10px;
      font-weight: 700;
      margin: 0;
      line-height: 1.2;
      white-space: normal;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      color: rgba(255, 255, 255, 0.9);
    }

    #fpLyricsArea {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      z-index: 1;
      position: relative;
    }

    #fpLyricsContainer {
      min-height: 12px;
      overflow: visible;
      text-align: center;
      width: 100%;
      position: relative;
    }

    #fpLyricText {
      font-size: 10px;
      line-height: 1.2;
      color: rgba(255, 255, 255, 0.6);
      margin: 0;
      white-space: nowrap;
      max-width: 100%;
      position: relative;
      z-index: 1;
    }

    #fpMusicQuality {
      font-size: 6px;
      padding: 1px 4px;
      border-radius: 100px;
      background: rgba(37, 98, 234, 0.2);
      font-weight: 600;
      color: #a8d4ff;
      text-align: left;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
    }

    #fpMusicSize {
      font-size: 6px;
      padding: 1px 4px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.1);
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      text-align: left;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
    }

    #fpTimeDisplay {
      font-size: 6px;
      color: rgba(255, 255, 255, 0.4);
      font-variant-numeric: tabular-nums;
      text-align: left;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 4px;
    }

    #fpPlayerWrap {
      flex-shrink: 0;
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    #fpRing {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid transparent;
      background: conic-gradient(from 0deg, rgba(120, 80, 255, 0) 0%, rgba(120, 80, 255, 0.9) 30%, rgba(60, 200, 240, 0.9) 60%, rgba(120, 80, 255, 0) 100%) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }

    #fpPlayerWrap.playing #fpRing {
      opacity: 1;
      animation: ringRotate 3s linear infinite;
    }

    @keyframes ringRotate {
      to { transform: rotate(360deg); }
    }

    .ctrl-icon {
      transition: opacity 0.25s, transform 0.25s;
      transform-origin: center;
    }

    .icon-pause {
      opacity: 0;
      transform: scale(0.7);
    }

    #fpPlayerWrap.playing .icon-play {
      opacity: 0;
      transform: scale(0.7);
    }

    #fpPlayerWrap.playing .icon-pause {
      opacity: 1;
      transform: scale(1);
    }

    .fp-icon-fill {
      fill: rgba(255, 255, 255, 0.95);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: rgba(5, 5, 15, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: max(2px, env(safe-area-inset-bottom));
      z-index: 40;
      pointer-events: auto;
    }

    .tab-nav {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      max-width: 420px;
      position: relative;
      padding: 0 8px;
    }

    .tab-nav .tab-indicator {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      border-radius: 14px;
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid rgba(124, 58, 237, 0.3);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 0;
      pointer-events: none;
    }

    .tab-nav .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 14px;
      border-radius: 14px;
      cursor: pointer;
      position: relative;
      z-index: 1;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.45);
      transition: color 0.3s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .tab-nav .tab-item svg {
      width: 22px;
      height: 22px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-nav .tab-item span {
      font-size: 10px;
      font-weight: 500;
      line-height: 1;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
    }

    .tab-nav .tab-item.active {
      color: #ffffff;
    }

    .tab-nav .tab-item.active svg {
      transform: scale(1.1);
    }

    .tab-nav .tab-item.active span {
      color: var(--primary-purple);
      font-weight: 600;
    }

    .tab-nav .tab-item:not(.active):hover {
      color: rgba(255, 255, 255, 0.7);
    }

    .tab-nav .tab-item:not(.active):hover svg {
      transform: scale(1.05);
    }

    .tab-nav .tab-item:active svg {
      transform: scale(0.92);
    }

    @media (max-width: 375px) {
      .main-title {
        font-size: 26px;
      }
      .header-section {
        padding: 12px 12px 0;
      }
      .stats-section {
        padding: 0 12px;
      }
      .hot-tracks {
        width: 200px;
      }
    }
  </style>
  <script type="module" crossorigin src="/music/assets/index-CQBWrHkF.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div class="bg-glow"></div>
  <div class="bg-glow-right"></div>
  
  <div class="ui-overlay">
    <div class="header-section interactive">
      <div class="title-block">
        <h1 class="main-title">
          <span class="title-gradient">全球</span>一起听
          <span class="wave-icon">
            <svg width="32px" height="16px" viewBox="0 0 36 18" fill="none">
              <path d="M2 14C2 14 5 10 6 8C8 6 11 6 13 8C14 10 15 14 15 14C15 14 16 10 18 8C20 6 23 6 25 8C27 10 27 14 27 14" stroke="url(#waveGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <defs>
                <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
